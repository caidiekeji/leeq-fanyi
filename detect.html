<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内容检测 - LeeQ AI 智能内容分析</title>
  <meta name="description" content="LeeQ 内容检测 - 基于大语言模型的智能内容分析工具，支持合规检测、质量评估、AI生成检测、敏感信息检测">
  <meta name="keywords" content="内容检测，AI检测，合规检测，质量评估，敏感信息检测，AIGC检测">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://lq-26k.pages.dev/detect">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231387c0'><path d='M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z'/></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/detect.css">
</head>
<body>
  <div class="app-bg"></div>

  <a href="#detector" class="skip-link">跳到主内容</a>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z"/></svg>
        <span>LeeQ 内容检测</span>
      </a>
      <div class="navbar-actions">
        <a href="/" class="nav-link" title="返回翻译">翻译</a>
        <button class="icon-btn" id="themeBtn" title="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="main-container" id="detector">
    <div class="detect-wrapper">
      <!-- 检测类型选择 -->
      <div class="detect-types">
        <button class="detect-type-btn active" data-type="compliance">
          <span class="type-icon">&#x1F6E1;</span>
          <span class="type-label">合规检测</span>
          <span class="type-desc">检测内容是否合规合法</span>
        </button>
        <button class="detect-type-btn" data-type="quality">
          <span class="type-icon">&#x2B50;</span>
          <span class="type-label">质量评估</span>
          <span class="type-desc">评估内容写作质量</span>
        </button>
        <button class="detect-type-btn" data-type="aiDetection">
          <span class="type-icon">&#x1F916;</span>
          <span class="type-label">AI生成检测</span>
          <span class="type-desc">判断是否由AI生成</span>
        </button>
        <button class="detect-type-btn" data-type="sensitiveInfo">
          <span class="type-icon">&#x1F512;</span>
          <span class="type-label">敏感信息检测</span>
          <span class="type-desc">发现泄露的敏感信息</span>
        </button>
      </div>

      <!-- 输入区域 -->
      <div class="detect-input-area">
        <textarea id="detectText" class="text-input detect-textarea"
          placeholder="在此粘贴需要检测的内容...&#10;支持文章、评论、文案、代码片段等各种文本格式&#10;最多支持 10000 字符"
          maxlength="10000"></textarea>
        <div class="detect-input-footer">
          <span class="char-count"><span id="charCount">0</span> / 10000</span>
          <button id="detectBtn" class="detect-submit-btn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>开始检测</span>
          </button>
        </div>
      </div>

      <!-- 加载状态 -->
      <div id="detectLoading" class="detect-loading" style="display:none">
        <div class="loading-spinner"></div>
        <p>AI 正在分析您的内容...</p>
      </div>

      <!-- 检测报告 -->
      <div id="detectReport" class="detect-report" style="display:none"></div>
    </div>
  </main>

  <script src="/js/detect.js"></script>
</body>
</html>
