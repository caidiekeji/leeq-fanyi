<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIGC检测 - LeeQ AI 智能内容分析平台</title>
  <meta name="description" content="LeeQ AIGC检测 - 基于大语言模型的智能内容分析工具，支持AI生成检测、合规检测、质量评估、敏感信息检测，精准高效">
  <meta name="keywords" content="AIGC检测，AI内容检测，AI生成文本识别，合规检测，质量评估，敏感信息检测，智能分析">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="AIGC检测 - LeeQ AI 智能内容分析平台">
  <meta property="og:description" content="基于大语言模型的智能内容分析，支持AI生成检测、合规检测、质量评估、敏感信息检测">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LeeQ 翻译">
  <meta property="og:url" content="https://lq-26k.pages.dev/detect">
  <meta property="og:image" content="https://lq-26k.pages.dev/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AIGC检测 - LeeQ AI 智能内容分析平台">
  <meta name="twitter:description" content="基于大语言模型的智能内容分析工具">
  <meta name="twitter:image" content="https://lq-26k.pages.dev/og-image.png">
  <meta name="author" content="LeeQ">
  <link rel="canonical" href="https://lq-26k.pages.dev/detect">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "LeeQ AIGC 检测",
    "url": "https://lq-26k.pages.dev/detect",
    "description": "基于大语言模型的智能内容分析工具，支持AI生成检测、合规检测、质量评估、敏感信息检测",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web Browser",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
    "author": { "@type": "Person", "name": "LeeQ" }
  }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230D9488'><path d='M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Satoshi:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/detect.css">
</head>
<body>
  <div class="app-bg"></div>
  <div class="app-bg-decor" aria-hidden="true">
    <div class="decor-blob blob-1"></div>
    <div class="decor-blob blob-2"></div>
  </div>

  <noscript>
    <div style="padding:20px;text-align:center;font-size:16px;color:#333;">
      <p>LeeQ AIGC 内容检测 - 基于大语言模型的智能内容分析工具</p>
      <p>您的浏览器未启用 JavaScript，请启用后获得完整功能体验。</p>
    </div>
  </noscript>

  <a href="#detector" class="skip-link">跳到主内容</a>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z"/></svg>
        <span>LeeQ</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link">翻译</a>
        <a href="/detect" class="nav-link active" aria-current="page">AIGC检测</a>
        <a href="/chat" class="nav-link">AI聊天</a>
      </div>
      <div class="navbar-actions">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="打开菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- ================================================================
       主工作区: 英雄区 → 功能特性 → 检测工具 → 结果展示
       ================================================================ -->
  <main class="detect-main" id="detector">

    <!-- ===== 检测工具区 — v6 左右分屏布局 ===== -->
    <section class="tool-section reveal-item">
      <!-- 工作区状态指示器 -->
      <div class="detect-status-bar">
        <span class="detect-status-dot"></span>
        <span class="detect-status-text">AI 检测引擎就绪</span>
      </div>

      <!-- 检测类型标签 -->
      <div class="detect-type-tabs" id="detectTypeTabs" role="tablist">
        <button class="detect-type-tab active" role="tab" aria-selected="true" data-type="aiDetection">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <span>AI生成检测</span>
        </button>
        <button class="detect-type-tab" role="tab" aria-selected="false" data-type="compliance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span>合规检测</span>
        </button>
        <button class="detect-type-tab" role="tab" aria-selected="false" data-type="quality">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>质量评估</span>
        </button>
        <button class="detect-type-tab" role="tab" aria-selected="false" data-type="sensitiveInfo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>敏感信息检测</span>
        </button>
      </div>

      <!-- 隐藏的下拉选择器（JS 兼容） -->
      <select id="detectType" style="display:none" aria-hidden="true">
        <option value="aiDetection" selected>AI生成检测</option>
        <option value="compliance">合规检测</option>
        <option value="quality">质量评估</option>
        <option value="sensitiveInfo">敏感信息检测</option>
      </select>

      <!-- ===== 分屏工作区：左输入 | 右结果 ===== -->
      <div class="detect-workspace">

        <!-- 左侧：输入面板 -->
        <div class="detect-workspace-left">
          <div class="detect-input-card" id="detectInputCard">
            <div class="detect-card-header">
              <div class="detect-card-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                输入待检测内容
              </div>
              <span class="detect-card-hint">支持文章、评论、文案、代码片段等</span>
            </div>
            <textarea id="detectText" class="detect-textarea"
              placeholder="在此粘贴需要检测的内容...&#10;支持 Ctrl+Enter 快速检测，最多 10000 字符"
              maxlength="10000" aria-label="待检测内容"></textarea>
            <div class="detect-input-footer">
              <div class="detect-shortcut">
                <kbd>Ctrl</kbd> + <kbd>Enter</kbd> 快速检测
              </div>
              <span id="sourceCount" class="detect-char-count">0 / 10000</span>
              <button id="detectBtn" class="detect-submit-btn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span>开始检测</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 右侧：结果区域（加载/空状态/报告） -->
        <div class="detect-workspace-right">
          <!-- 加载状态 -->
          <div id="detectLoading" class="detect-loading-card is-hidden" role="status" aria-label="检测中">
            <div class="detect-loading-spinner"></div>
            <p class="detect-loading-text">AI 正在分析您的内容...</p>
            <div class="detect-loading-progress">
              <div class="detect-loading-bar"></div>
            </div>
          </div>

          <!-- 空状态 -->
          <div id="detectPlaceholder" class="detect-empty-card">
            <svg viewBox="0 0 72 72" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="36" cy="36" r="28"/><path d="M36 24v16"/><path d="M36 44h.02" stroke-width="3"/></svg>
            <h3 class="detect-empty-title">等待检测</h3>
            <p class="detect-empty-desc">选择检测类型，粘贴内容后点击"开始检测"，详细分析报告将显示在这里</p>
          </div>

          <!-- 结果卡片 -->
          <div id="detectReport" class="detect-result-card is-hidden">
            <div class="detect-result-header">
              <div class="detect-result-title-group">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span class="detect-result-title">检测报告</span>
              </div>
              <div class="detect-result-actions">
                <span id="resultCount" class="detect-result-meta is-hidden"></span>
                <button class="detect-result-close" id="resultCloseBtn" aria-label="关闭报告">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
            </div>
            <div class="detect-result-body" id="reportBody">
              <!-- 报告内容由 JS 动态填充 -->
            </div>
          </div>
        </div>

      </div><!-- /detect-workspace -->

    </section>

  </main>

  <!-- 页脚 -->
  <footer class="footer"></footer>

  <script src="/js/detect.js"></script>

  <script>
    /* ====== 导航栏滚动阴影 ====== */
    (function() {
      var navbar = document.querySelector('.navbar');
      var scrollHandler = function() {
        navbar.classList.toggle('scrolled', window.scrollY > 10);
      };
      window.addEventListener('scroll', scrollHandler, { passive: true });
      scrollHandler();
    })();

    /* ====== 移动端菜单 ====== */
    (function() {
      var toggle = document.getElementById('mobileMenuToggle');
      var nav = document.getElementById('navLinks');
      if (toggle && nav) {
        toggle.addEventListener('click', function() {
          var isOpen = nav.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          toggle.setAttribute('aria-label', isOpen ? '关闭菜单' : '打开菜单');
        });
        document.addEventListener('click', function(e) {
          if (!toggle.contains(e.target) && !nav.contains(e.target) && nav.classList.contains('is-open')) {
            nav.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', '打开菜单');
          }
        });
      }
    })();

    /* ====== 关闭结果报告 ====== */
    (function() {
      var closeBtn = document.getElementById('resultCloseBtn');
      var report = document.getElementById('detectReport');
      if (closeBtn && report) {
        closeBtn.addEventListener('click', function() {
          report.classList.add('is-hidden');
          var ph = document.getElementById('detectPlaceholder');
          if (ph) ph.classList.remove('is-hidden');
        });
      }
    })();
  </script>
</body>
</html>
