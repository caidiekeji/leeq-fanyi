<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="LeeQ AI 聊天 - 基于大语言模型的智能对话助手，支持多轮对话，智能问答">

  <meta name="twitter:description" content="LeeQ AI 聊天 - 基于大语言模型的智能对话助手，支持多轮对话，智能问答">
  <meta name="twitter:image" content="https://lq-26k.pages.dev/og-image.png">
  <!-- JSON-LD 结构化数据 -->

    "@context": "https://schema.org",

  <link rel="canonical" href="https://lq-26k.pages.dev/chat">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231387c0'><path d='M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z'/></svg>">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Satoshi:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <div class="app-bg"></div>

  <div class="floating-shapes" aria-hidden="true">
    <div class="floating-shape floating-shape-1"></div>
    <div class="floating-shape floating-shape-2"></div>
    <div class="floating-shape floating-shape-3"></div>
  </div>

  <noscript>
    <div style="padding:20px;text-align:center;font-size:16px;color:#333;">
      <p>LeeQ AI 聊天 - 基于大语言模型的智能对话助手，支持多轮对话、智能问答。</p>
      <p>您的浏览器未启用 JavaScript，请启用后获得完整功能体验。</p>
    </div>
  </noscript>

  <!-- 整体布局：左侧边栏 + 右侧聊天区 -->
  <div class="chat-layout">

    <!-- 移动端遮罩层 -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- ====== 左侧边栏 ====== -->
    <aside class="chat-sidebar" id="chatSidebar">
      <!-- 侧边栏顶部：品牌 + 折叠按钮 -->
      <div class="sidebar-header">
        <a href="/" class="sidebar-brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span class="sidebar-brand-text">LeeQ</span>
        </a>
        <button class="sidebar-toggle" id="sidebarToggle" title="收起侧边栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
      </div>

      <!-- 侧边栏操作区 -->
      <nav class="sidebar-nav">
        <!-- 首页 -->
        <a href="index.html" class="sidebar-action" id="homeBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>首页</span>
        </a>

        <!-- 新建对话 -->
        <button class="sidebar-action" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>新对话</span>
        </button>

        <!-- 清空历史 -->
        <button class="sidebar-action" id="clearChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          <span>清空历史</span>
        </button>

        <!-- 分隔：工具 -->
        <div class="sidebar-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>工具</span>
        </div>

        <!-- 创建技能（带角标） -->
        <button class="sidebar-item sidebar-item-badge" id="createSkillBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>创建技能</span>
          <span class="badge-new">+</span>
        </button>

        <!-- 分隔：历史记录 -->
        <div class="sidebar-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>历史记录</span>
        </div>

        <!-- 历史列表容器 -->
        <div class="sidebar-history-list" id="historyList">
          <div class="sidebar-empty-hint">暂无历史记录</div>
        </div>
      </nav>

      <!-- 侧边栏底部：用户信息 -->
      <div class="sidebar-footer">
        <div class="footer-mode-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="12" height="12"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
          <span>聊天模式</span>
        </div>
        <div class="footer-user-area">
          <div class="user-avatar-sm">U</div>
          <span class="user-name-sm">User</span>
          <button class="theme-toggle-sm" id="themeBtn" title="切换主题" aria-label="切换主题">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ====== 右侧主内容区 ====== -->
    <main class="chat-main" id="chatMain">
      <!-- 移动端汉堡菜单按钮 -->
      <button class="mobile-menu-btn" id="mobileMenuBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <!-- 消息列表区域 -->
      <div class="chat-messages" id="chatMessages">
        <!-- 空状态：居中显示输入框（DeepSeek 极简风格） -->
        <div class="chat-welcome" id="chatWelcome">
          <div class="welcome-content">
            <!-- DeepSeek 风格输入框 -->
            <div class="ds-input-box">
              <textarea id="chatInput" class="ds-textarea" placeholder="输入你的问题..." rows="4" maxlength="5000"></textarea>
              <div class="ds-toolbar">
                <div class="ds-toolbar-left">
                  <!-- 搜索模式（地球图标 - 联网搜索） -->
                  <button class="ds-tool-btn" id="searchModeBtn" title="联网搜索" aria-label="联网搜索">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                  </button>
                  <select class="ds-select" id="searchEngineSelect" title="选择搜索引擎" style="display:none">
                    <option value="bing">必应</option>
                    <option value="baidu">百度</option>
                    <option value="sogou">搜狗</option>
                    <option value="yandex">Yandex</option>
                  </select>
                  <!-- 技能（闪光图标 - AI技能） -->
                  <button class="ds-tool-btn" id="skillBtn" title="选择技能" aria-label="选择技能">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.5 4.5H18l-3.75 2.7 1.5 4.5L12 12l-3.75 2.7 1.5-4.5L6 7.5h4.5z"/><path d="M19 21l-1.5-4.5h-4.5l3.75-2.7L15.5 9.3"/></svg>
                  </button>
                  <!-- 上传文件（回形针图标） -->
                  <button class="ds-tool-btn" id="uploadBtn" title="上传文件" aria-label="上传文件">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                  </button>
                  <input type="file" id="fileInput" accept=".txt,.md,.json,.csv,.xml,.yaml,.yml,.log,.js,.ts,.jsx,.tsx,.py,.java,.c,.cpp,.h,.hpp,.rs,.go,.rb,.php,.swift,.kt,.scala,.vue,.svelte,.html,.css,.scss,.less,.env,.cfg,.ini,.conf,.sh,.bat,.ps1,.sql" style="display:none">
                  <span class="ds-filename is-hidden" id="uploadFilename"></span>
                </div>
                <div class="ds-toolbar-right">
                  <span class="ds-char-count" id="charCount">0 / 5000</span>
                  <button id="sendBtn" class="ds-send-btn" disabled title="发送消息">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                  </button>
                </div>
              </div>
              <!-- 技能选择面板 -->
              <div class="ds-skill-panel is-hidden" id="skillPanel">
                <div class="ds-skill-list" id="skillPanelList">
                  <div class="ds-skill-empty">暂无可用技能，请在管理后台添加</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 加载指示器 -->
      <div class="chat-loading is-hidden" id="chatLoading">
          <div class="chat-loading-dots">
            <span></span><span></span><span></span>
          </div>
          <span class="chat-loading-text">AI 正在思考...</span>
        </div>
      </div>

      <!-- 有消息时的底部输入框 -->
      <div class="chat-input-bottom is-hidden" id="chatInputBottom">
        <div class="ds-bottom-wrapper">
          <div class="ds-input-box">
            <textarea id="chatInputBottomEl" class="ds-textarea" placeholder="输入你的问题... (Enter 发送)" rows="1" maxlength="5000"></textarea>
            <div class="ds-toolbar">
              <div class="ds-toolbar-left">
                <!-- 搜索模式（地球图标） -->
                <button class="ds-tool-btn" id="searchModeBtn2" title="联网搜索" aria-label="联网搜索">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                </button>
                <select class="ds-select" id="searchEngineSelect2" title="选择搜索引擎" style="display:none">
                  <option value="bing">必应</option>
                  <option value="baidu">百度</option>
                  <option value="sogou">搜狗</option>
                  <option value="yandex">Yandex</option>
                </select>
                <!-- 技能（闪光图标） -->
                <button class="ds-tool-btn" id="skillBtn2" title="选择技能" aria-label="选择技能">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.5 4.5H18l-3.75 2.7 1.5 4.5L12 12l-3.75 2.7 1.5-4.5L6 7.5h4.5z"/><path d="M19 21l-1.5-4.5h-4.5l3.75-2.7L15.5 9.3"/></svg>
                </button>
                <!-- 上传文件（回形针图标） -->
                <button class="ds-tool-btn" id="uploadBtn2" title="上传文件" aria-label="上传文件">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <span class="ds-filename is-hidden" id="uploadFilename2"></span>
              </div>
              <div class="ds-toolbar-right">
                <button id="sendBtnBottom" class="ds-send-btn" disabled title="发送消息">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <!-- 本地技能创建弹窗 -->
  <div class="skill-create-overlay" id="skillCreateOverlay">
    <div class="skill-create-modal">
      <div class="skill-create-header">
        <h3 class="skill-create-title" id="skillCreateTitle">创建自定义技能</h3>
        <button class="skill-create-close" id="skillCreateClose" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="skill-create-body">
        <label class="skill-create-label">技能名称 <span class="required">*</span></label>
        <input class="skill-create-input" id="skillCreateName" type="text" placeholder="例如：翻译助手、代码审查、写作助手" maxlength="30">
        <label class="skill-create-label">技能描述（可选）</label>
        <input class="skill-create-input" id="skillCreateDesc" type="text" placeholder="简短描述该技能的功能" maxlength="100">
        <label class="skill-create-label">系统提示词 <span class="required">*</span></label>
        <textarea class="skill-create-textarea" id="skillCreatePrompt" placeholder="输入该技能的 System Prompt，将作为系统提示词发送给 AI 模型...&#10;&#10;示例：你是一位专业的翻译助手，请将用户的内容翻译成目标语言。" rows="6" maxlength="2000"></textarea>
        <p class="skill-create-hint">提示词将在选择此技能后附加到对话中，影响 AI 的回复风格和行为。</p>
      </div>
      <div class="skill-create-footer">
        <button class="skill-create-btn skill-create-btn-cancel" id="skillCreateCancel">取消</button>
        <button class="skill-create-btn skill-create-btn-save" id="skillCreateSave">保存技能</button>
      </div>
    </div>
  </div>

  <!-- Markdown 渲染库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 代码高亮 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/css.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/xml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/rust.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/languages/typescript.min.js"></script>
  <!-- Mermaid 图表 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script src="/js/utils.js"></script>
  <script src="/js/chat.js"></script>

  <script>
    /* Mobile Menu Toggle */
    (function() {
      var toggle = document.getElementById('mobileMenuToggle');
      var nav = document.getElementById('navLinks');
      if (toggle && nav) {
        toggle.addEventListener('click', function() {
          var isOpen = nav.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          toggle.setAttribute('aria-label', isOpen ? '关闭菜单' : '打开菜单');
        });
        document.addEventListener('click', function(e) {
          if (!toggle.contains(e.target) && !nav.contains(e.target) && nav.classList.contains('is-open')) {
            nav.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', '打开菜单');
          }
        });
      }
    })();
    /* Navbar Scroll Shadow — not used in chat layout */
    (function() {
      var navbar = document.querySelector('.navbar');
      if (!navbar) return;
      var scrollHandler = function() {
        if (window.scrollY > 10) { navbar.classList.add('scrolled'); }
        else { navbar.classList.remove('scrolled'); }
      };
      window.addEventListener('scroll', scrollHandler, { passive: true });
      scrollHandler();
    })();
  </script>
</body>
</html>
