<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="keywords" content="翻译, AI, SaaS, 多语言, 大语言模型, LeeQ">
  <meta property="og:title" content="翻译 - LeeQ AI 智能多语言翻译平台">
  <meta property="og:description" content="基于大语言模型的专业翻译服务，支持 20+ 语言互译，精准理解上下文语境">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LeeQ 翻译">
  <meta property="og:url" content="https://lq-26k.pages.dev/">
  <meta property="og:image" content="https://lq-26k.pages.dev/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="翻译 - LeeQ AI 智能多语言翻译平台">
  <meta name="twitter:description" content="基于大语言模型的专业翻译服务，支持 20+ 语言互译">
  <meta name="twitter:image" content="https://lq-26k.pages.dev/og-image.png">
  <meta name="robots" content="index, follow">
  <meta name="author" content="LeeQ">
  <link rel="canonical" href="https://lq-26k.pages.dev/">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "LeeQ 翻译",
      "url": "https://lq-26k.pages.dev/",
      "description": "基于大语言模型的专业翻译服务，支持 20+ 语言互译",
      "applicationCategory": "UtilityApplication",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" },
      "author": { "@type": "Person", "name": "LeeQ" }
    }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300A86B'><path d='M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Satoshi:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/translate.css">
  <style>
    .is-hidden { display: none !important; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="app-bg">
    <div class="floating-blob blob-1"></div>
    <div class="floating-blob blob-2"></div>
  </div>

  <noscript>
    <div style="padding:20px;text-align:center;font-size:16px;color:var(--color-text-secondary);">
      <p>LeeQ 翻译 - 基于大语言模型的多语言翻译工具，支持 20+ 语言互译。</p>
      <p>您的浏览器未启用 JavaScript，请启用后获得完整功能。</p>
    </div>
  </noscript>

  <a href="#translator" class="skip-link">跳到主内容</a>

  <!-- 公告栏 -->
  <div id="announcementBar" class="announcement-bar hidden">
    <span id="announcementText"></span>
  </div>

  <!-- 导航栏 -->
  <nav class="navbar" aria-label="主导航">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z"/></svg>
        <span id="siteName">LeeQ</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link active" aria-current="page">翻译</a>
        <a href="/detect" class="nav-link">AIGC检测</a>
        <a href="/chat" class="nav-link">AI聊天</a>
      </div>
      <div class="navbar-actions">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="打开菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="translate-main" id="translator">
    <!-- ===== Translate Workspace ===== -->
    <div class="tw-workspace stagger-item">
      <!-- Top bar: language + toolbar, integrated -->
      <div class="tw-top-bar">
        <div class="tw-lang-group">
          <select id="sourceLang" class="tw-lang-select" aria-label="源语言">
            <option value="auto" selected>自动检测</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
          <button class="tw-swap-btn" id="swapLangBtn" aria-label="交换语言" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
          <select id="targetLang" class="tw-lang-select" aria-label="目标语言">
            <option value="zh" selected>中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>
        <div class="tw-action-group">
          <button class="tw-tool-btn" id="realtimeBtn" aria-label="实时翻译" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </button>
          <button id="translateBtn" class="tw-primary-btn" disabled aria-disabled="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z"/></svg>
            <span>翻译</span>
          </button>
        </div>
      </div>

      <!-- Live status indicator -->
      <div class="tw-workspace-status">
        <span class="breathing-dot"></span>
        <span class="tw-workspace-status-text">AI 翻译引擎就绪</span>
      </div>

      <!-- Unified Panel: source + result in one container (left-right) -->
      <div class="tw-panel-unified">
        <!-- Source area (left) -->
        <div class="tw-uni-source">
          <div class="tw-uni-head">
            <span class="tw-uni-label">源文本</span>
            <span class="tw-uni-badge" id="sourceBadge">自动检测</span>
            <div class="tw-result-acts">
              <button class="tw-icon-btn" id="clearBtn" title="清空" aria-label="清空" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
          <textarea id="sourceText" class="tw-textarea" placeholder="输入要翻译的文本..." maxlength="10000" aria-label="源文本输入"></textarea>
          <div class="tw-uni-foot">
            <div class="tw-shortcuts">
              <span><kbd>Ctrl+Enter</kbd> 翻译</span>
              <span><kbd>Ctrl+D</kbd> 清空</span>
            </div>
            <span id="sourceCount" class="tw-count">输入 0 / 5000</span>
          </div>
        </div>

        <!-- Result area (right) -->
        <div class="tw-uni-result">
          <div class="tw-uni-head">
            <span class="tw-uni-label">翻译结果</span>
            <div class="tw-result-acts">
              <button class="tw-icon-btn" id="copyBtn" title="复制" aria-label="复制" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              </button>
              <button class="tw-icon-btn" id="exportBtn" title="导出" aria-label="导出" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </button>
            </div>
          </div>
          <div class="tw-uni-body">
            <div id="resultText" class="tw-result empty">
              <div class="tw-empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z"/></svg>
              </div>
              <p class="tw-empty-text">输入文本并点击「翻译」</p>
              <p class="tw-empty-hint">支持 20+ 语言互译，自动检测源语言</p>
            </div>
            <!-- Skeleton loader (shown during translation) -->
            <div id="resultSkeleton" class="tw-skeleton is-hidden">
              <div class="tw-skel-line" style="width:92%"></div>
              <div class="tw-skel-line" style="width:78%"></div>
              <div class="tw-skel-line" style="width:85%"></div>
              <div class="tw-skel-line" style="width:45%"></div>
            </div>
          </div>
          <div class="tw-uni-foot">
            <span id="resultCount" class="tw-count">输出 0</span>
          </div>
        </div>
      </div>

  </main>

  <div id="toast" class="toast"></div>

  <footer class="footer" id="footerText"></footer>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // Mobile menu toggle
    (function(){
      var toggle=document.getElementById('mobileMenuToggle');
      var nav=document.getElementById('navLinks');
      if(toggle&&nav){
        toggle.addEventListener('click',function(){
          var isOpen=nav.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded',isOpen?'true':'false');
          toggle.setAttribute('aria-label',isOpen?'关闭菜单':'打开菜单');
        });
        document.addEventListener('click',function(e){
          if(!toggle.contains(e.target)&&!nav.contains(e.target)&&nav.classList.contains('is-open')){
            nav.classList.remove('is-open');
            toggle.setAttribute('aria-expanded','false');
            toggle.setAttribute('aria-label','打开菜单');
          }
        });
      }
    })();

    // Swap language button
    (function(){
      var swapBtn=document.getElementById('swapLangBtn');
      if(!swapBtn) return;
      swapBtn.addEventListener('click',function(){
        var src=document.getElementById('sourceLang');
        var tgt=document.getElementById('targetLang');
        if(!src||!tgt) return;
        var tmp=src.value; src.value=tgt.value; tgt.value=tmp;
        src.dispatchEvent(new Event('change'));
        tgt.dispatchEvent(new Event('change'));
      });
    })();

    // Navbar scroll shadow
    (function(){
      var navbar=document.querySelector('.navbar');
      function onScroll(){
        if(window.scrollY>10) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
      }
      window.addEventListener('scroll',onScroll,{passive:true});
      onScroll();
    })();
  </script>
</body>
</html>
