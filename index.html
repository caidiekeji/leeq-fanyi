<body>

        </button>
      </div>
    </div>
  </nav>

  <main class="translate-main" id="translator">
    <!-- 页面头部 -->
    <div class="translate-header">
      <h1 class="page-title">智能翻译</h1>
      <p class="page-subtitle">基于大语言模型的多语言智能翻译，支持 20+ 种语言互译，格式完美保留</p>
    </div>

    <div class="translate-workspace">
      <div class="translate-control-bar">
        <div class="translate-control-left">
          <select id="sourceLang" class="lang-select"></select>
          <button class="swap-btn" id="swapBtn" title="互换语言">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
          <select id="targetLang" class="lang-select"></select>
        </div>
        <div class="translate-control-right">
          <button class="tool-btn" id="realtimeBtn" title="实时翻译" aria-label="实时翻译">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </button>
          <button id="translateBtn" class="translate-btn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z"/></svg>
            <span>翻译</span>
          </button>
          <button class="tool-btn" id="exportBtn" title="导出" aria-label="导出">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button class="tool-btn" id="copyBtn" title="复制" aria-label="复制">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="tool-btn" id="clearBtn" title="清空" aria-label="清空">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="split-panels">
        <section class="panel panel-source">
          <div class="panel-body">
            <textarea id="sourceText" class="text-input" placeholder="输入要翻译的文本...&#10;支持 Ctrl+Enter 翻译 · Ctrl+D 清空 · Ctrl+K 聚焦&#10;支持拖拽 .txt / .md / .srt / .json 文件" maxlength="10000"></textarea>
          </div>
          <div class="panel-footer">
            <div class="shortcut-hints">
              <span><kbd>Ctrl+Enter</kbd> 翻译</span>
              <span><kbd>Ctrl+D</kbd> 清空</span>
              <span><kbd>Ctrl+K</kbd> 聚焦</span>
            </div>
            <span id="sourceCount" class="char-count">输入 0 / 5000</span>
          </div>
        </section>

        <section class="panel panel-result">
          <div class="panel-body">
            <div id="resultText" class="result-display empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><path d="M12.87 15.07l-2.54-2.51.03-.03A17.52 17.52 0 0 0 14.07 6H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l4.5-12z"/></svg>
              <p>翻译结果将显示在这里</p>
            </div>
          </div>
          <div class="panel-footer">
            <span id="resultCount" class="char-count">输出 0</span>
          </div>
        </section>
      </div>

  <div id="toast" class="toast"></div>

  <footer class="footer" id="footerText">
    Powered by LeeQ 旗下产品 · 由 jie 开发 · Cloudflare 提供加速服务
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
  <script>
    (async function() {
      try {
        const res = await fetch('/api/admin/seo');
        if (res.ok) {
          const data = await res.json();
          if (data.code === 200 && data.data) {
            const { title, description, keywords, ogImage } = data.data;
            if (title) {
              document.title = title;
              const sn = document.getElementById('siteName');
              if (sn) sn.textContent = title;
            }
            if (description) document.querySelector('meta[name="description"]').content = description;
            if (keywords) document.querySelector('meta[name="keywords"]').content = keywords;
            // 动态更新规范链接
            if (title) {
              const canonical = document.querySelector('link[rel="canonical"]');
              if (canonical) canonical.href = 'https://lq-26k.pages.dev/';
              // 动态更新 JSON-LD 结构化数据
              const ld = document.querySelector('script[type="application/ld+json"]');
              if (ld) {
                try {
                  const json = JSON.parse(ld.textContent);
                  json.name = title;
                  json.description = description || json.description;
                  if (ogImage) json.image = ogImage;
                  ld.textContent = JSON.stringify(json);
                } catch {}
              }
            }
          }
        }
      } catch {}
      try { fetch('/api/admin/stats?action=track'); } catch {}
    })();
  </script>
</body>
</html>
