  <script>
    /* ====== Mobile Menu Toggle ====== */
    (function() {
      var toggle = document.getElementById('mobileMenuToggle');
      var nav = document.getElementById('navLinks');
      if (toggle && nav) {
        toggle.addEventListener('click', function() {
          var isOpen = nav.classList.toggle('is-open');
          toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          toggle.setAttribute('aria-label', isOpen ? '关闭菜单' : '打开菜单');
        });
        document.addEventListener('click', function(e) {
          if (!toggle.contains(e.target) && !nav.contains(e.target) && nav.classList.contains('is-open')) {
            nav.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
            toggle.setAttribute('aria-label', '打开菜单');
          }
        });
      }
    })();

    /* ====== Scroll Reveal & Number Count-Up — Intersection Observer ====== */
    (function() {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });

      document.querySelectorAll('.stagger-item').forEach(function(el, i) {
        el.style.transitionDelay = (i * 80) + 'ms';
        observer.observe(el);
      });

      /* Number count-up animation */
      var countObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            var el = entry.target;
            var target = parseInt(el.getAttribute('data-target'), 10) || 0;
            var suffix = el.getAttribute('data-suffix') || '';
            var duration = 1800;
            var startTime = null;

            function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

            function animate(timestamp) {
              if (!startTime) startTime = timestamp;
              var elapsed = timestamp - startTime;
              var progress = Math.min(elapsed / duration, 1);
              var easedProgress = easeOutCubic(progress);
              var current = Math.round(easedProgress * target);
              el.textContent = current + suffix;
              if (progress < 1) { requestAnimationFrame(animate); }
            }

            requestAnimationFrame(animate);
            countObserver.unobserve(el);
          }
        });
      }, { threshold: 0.3 });

      document.querySelectorAll('.stat-number[data-target]').forEach(function(el) {
        countObserver.observe(el);
      });
    })();

    /* ====== Kinetic Text — Title Character Reveal ====== */
    (function() {
      var title = document.querySelector('.page-header h1');
      if (!title) return;
      var wrapper = document.createElement('span');
      wrapper.className = 'kinetic-text';
      function walk(node) {
        var children = node.childNodes;
        for (var i = 0; i < children.length; i++) {
          var child = children[i];
          if (child.nodeType === 3) {
            var text = child.textContent;
            for (var j = 0; j < text.length; j++) {
              var span = document.createElement('span');
              span.className = 'char';
              span.textContent = text[j];
              span.style.animationDelay = (j * 40) + 'ms';
              wrapper.appendChild(span);
            }
          } else if (child.nodeType === 1) {
            var clone = child.cloneNode(false);
            walk(child);
            clone.innerHTML = '';
            while (child.firstChild) { clone.appendChild(child.firstChild); }
            wrapper.appendChild(clone);
          }
        }
      }
      walk(title);
      title.innerHTML = '';
      title.appendChild(wrapper);
    })();

    /* ====== Navbar Scroll Shadow ====== */
    (function() {
      var navbar = document.querySelector('.navbar');
      var scrollHandler = function() {
        if (window.scrollY > 10) { navbar.classList.add('scrolled'); }
        else { navbar.classList.remove('scrolled'); }
      };
      window.addEventListener('scroll', scrollHandler, { passive: true });
      scrollHandler();
    })();
  </script>
  <script>
    (async function() {
      try {
        const res = await fetch('/api/admin/seo');
        if (res.ok) {
          const data = await res.json();
          if (data.code === 200 && data.data) {
            const { title, description, keywords, ogImage } = data.data;
            if (title) { document.title = title; const sn = document.getElementById('siteName'); if (sn) sn.textContent = title; }
            if (description) document.querySelector('meta[name="description"]').content = description;
            if (keywords) document.querySelector('meta[name="keywords"]').content = keywords;
            if (title) {
              const canonical = document.querySelector('link[rel="canonical"]');
              if (canonical) canonical.href = 'https://lq-26k.pages.dev/';
              const ld = document.querySelector('script[type="application/ld+json"]');
              if (ld) { try { const json = JSON.parse(ld.textContent); json.name = title; json.description = description || json.description; if (ogImage) json.image = ogImage; ld.textContent = JSON.stringify(json); } catch {} }
            }
          }
        }
      } catch {}
      try { fetch('/api/admin/stats?action=track'); } catch {}
    })();
