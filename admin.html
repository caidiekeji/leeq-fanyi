<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - LLM 翻译</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="app-bg"></div>

  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="login-title">管理后台</h1>
      <p class="login-subtitle">LLM 多语言翻译系统</p>
      <div class="login-form">
        <div class="input-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input id="adminPassword" class="login-input" type="password" placeholder="输入管理员密码" autocomplete="current-password">
        </div>
        <button class="login-btn" onclick="handleLogin()">登 录</button>
      </div>
      <a href="/" class="login-back">返回主页</a>
    </div>
  </div>

  <div id="adminPage" class="admin-page" style="display:none">
    <nav class="admin-nav">
      <a href="/" class="admin-nav-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>管理后台</span>
      </a>
      <div class="admin-nav-actions">
        <a href="/" class="admin-nav-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          返回主页
        </a>
        <button class="admin-logout-btn" onclick="handleLogout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          退出登录
        </button>
      </div>
    </nav>

    <main class="admin-main">
      <div class="admin-grid">
        <section class="admin-card">
          <div class="admin-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            <h2 class="admin-card-title">模型提供商</h2>
          </div>
          <div id="providersList" class="providers-list"></div>
        </section>

        <section class="admin-card">
          <div class="admin-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <h2 class="admin-card-title">默认模型</h2>
          </div>
          <div class="default-models">
            <div class="form-row">
              <label class="form-label-sm">提供商</label>
              <select id="defaultProvider" class="form-select-sm"></select>
            </div>
            <div class="form-row">
              <label class="form-label-sm">模型</label>
              <select id="defaultModel" class="form-select-sm"></select>
            </div>
          </div>
        </section>

        <section class="admin-card full-width">
          <div class="admin-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <h2 class="admin-card-title">API Key 管理</h2>
          </div>
          <div id="apiKeysSection" class="api-keys-section">
            <div class="api-key-form">
              <div class="form-row-inline">
                <div class="form-row-sm">
                  <label class="form-label-sm">提供商</label>
                  <select id="apiKeyProviderSelect" class="form-select-sm">
                    <option value="openai">OpenAI</option>
                    <option value="anthropic">Claude</option>
                    <option value="gemini">Gemini</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="nvidia">NVIDIA NIM</option>
                    <option value="baidu">百度文心</option>
                    <option value="aliyun">阿里通义</option>
                    <option value="zhipu">智谱 AI</option>
                    <option value="minimax">MiniMax</option>
                    <option value="moonshot">月之暗面 Kimi</option>
                    <option value="xunfei">讯飞星火</option>
                    <option value="tencent">腾讯混元</option>
                    <option value="custom">自定义 API</option>
                  </select>
                </div>
                <div class="form-row-sm" id="customEndpointRow" style="display:none">
                  <label class="form-label-sm">API 端点</label>
                  <input id="customEndpoint" class="form-input-sm" type="url" placeholder="https://api.example.com/v1">
                </div>
              </div>
              <div class="form-row-sm">
                <label class="form-label-sm">API Key</label>
                <input id="apiKeyInput" class="form-input-sm" type="password" placeholder="sk-...">
              </div>
              <div class="api-key-actions">
                <button class="btn-sm btn-primary" onclick="handleSaveApiKey()">保存 Key</button>
                <button class="btn-sm btn-secondary" onclick="handleTestKey()">测试连接</button>
              </div>
            </div>
            <div id="savedKeysList" class="saved-keys-list"></div>
          </div>
        </section>

        <section class="admin-card full-width">
          <div class="admin-card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <h2 class="admin-card-title">提示词模板</h2>
          </div>
          <div class="prompt-section">
            <label class="form-label">翻译提示词</label>
            <textarea id="translatePrompt" class="form-textarea" placeholder="你是一个专业的翻译助手..."></textarea>
          </div>
          <div class="prompt-section">
            <label class="form-label">语言检测提示词</label>
            <textarea id="detectPrompt" class="form-textarea" placeholder="你是一个语言检测助手..."></textarea>
          </div>
        </section>
      </div>

      <div class="admin-actions">
        <button class="admin-save-btn" onclick="handleSaveConfig()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          保存配置
        </button>
      </div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/js/utils.js"></script>
  <script>
    let adminToken = sessionStorage.getItem('adminToken') || '';
    let currentProviders = JSON.parse(JSON.stringify(DEFAULT_PROVIDERS));
    const DEFAULT_PROVIDERS = {
      cloudflare: { name: 'Cloudflare Workers AI', enabled: true, models: [
        { id: '@cf/meta/m2m100-1.2b', name: 'm2m100 翻译专用' },
        { id: '@cf/meta/llama-3.1-8b-instruct', name: 'Llama 3.1 8B' }
      ]},
      openai: { name: 'OpenAI', enabled: true, models: [
        { id: 'gpt-4o-mini', name: 'GPT-4o Mini' },
        { id: 'gpt-4o', name: 'GPT-4o' }
      ]},
      anthropic: { name: 'Claude', enabled: true, models: [
        { id: 'claude-sonnet-4-20250514', name: 'Claude Sonnet 4' }
      ]},
      gemini: { name: 'Gemini', enabled: false, models: [
        { id: 'gemini-2.0-flash', name: 'Gemini 2.0 Flash' }
      ]},
      deepseek: { name: 'DeepSeek', enabled: false, models: [
        { id: 'deepseek-chat', name: 'DeepSeek Chat' }
      ]},
      nvidia: { name: 'NVIDIA NIM', enabled: false, models: [
        { id: 'nvidia/nemotron-4-340b-instruct', name: 'Nemotron 4 340B' },
        { id: 'nvidia/llama-3.1-nemotron-70b-instruct', name: 'Llama 3.1 Nemotron 70B' },
        { id: 'nvidia/mistral-nemo-minitron-8b-8k-instruct', name: 'Mistral NeMo Minitron 8B' }
      ]},
      baidu: { name: '百度文心', enabled: false, models: [
        { id: 'ernie-4.0-8k-latest', name: '文心一言 4.0' },
        { id: 'ernie-speed-128k', name: '文心 Speed' },
        { id: 'ernie-lite-8k', name: '文心 Lite' }
      ]},
      aliyun: { name: '阿里通义', enabled: false, models: [
        { id: 'qwen-max', name: '通义千问 Max' },
        { id: 'qwen-plus', name: '通义千问 Plus' },
        { id: 'qwen-turbo', name: '通义千问 Turbo' }
      ]},
      zhipu: { name: '智谱 AI', enabled: false, models: [
        { id: 'glm-4', name: 'GLM-4' },
        { id: 'glm-4-plus', name: 'GLM-4 Plus' },
        { id: 'glm-4-air', name: 'GLM-4 Air' }
      ]},
      minimax: { name: 'MiniMax', enabled: false, models: [
        { id: 'abab6.5-chat', name: 'abab6.5' },
        { id: 'abab7-chat', name: 'abab7' }
      ]},
      moonshot: { name: '月之暗面 Kimi', enabled: false, models: [
        { id: 'moonshot-v1-8k', name: 'Kimi 8K' },
        { id: 'moonshot-v1-32k', name: 'Kimi 32K' },
        { id: 'moonshot-v1-128k', name: 'Kimi 128K' }
      ]},
      xunfei: { name: '讯飞星火', enabled: false, models: [
        { id: 'generalv3.5', name: '星火 3.5' },
        { id: 'generalv3', name: '星火 V3' },
        { id: 'generalv2', name: '星火 V2' }
      ]},
      tencent: { name: '腾讯混元', enabled: false, models: [
        { id: 'hunyuan-turbo', name: '混元 Turbo' },
        { id: 'hunyuan-pro', name: '混元 Pro' },
        { id: 'hunyuan-lite', name: '混元 Lite' }
      ]},
      custom: { name: '自定义 API', enabled: true, models: [] }
    };

    const DEFAULT_MODEL_SELECT = document.getElementById('defaultModel');
    const DEFAULT_PROVIDER_SELECT = document.getElementById('defaultProvider');

    DEFAULT_PROVIDER_SELECT.addEventListener('change', () => {
      const provider = DEFAULT_PROVIDER_SELECT.value;
      const models = DEFAULT_PROVIDERS[provider]?.models || [];
      DEFAULT_MODEL_SELECT.innerHTML = '';
      if (models.length === 0) {
        DEFAULT_MODEL_SELECT.innerHTML = '<option value="">暂无可用模型</option>';
      } else {
        models.forEach(m => {
          DEFAULT_MODEL_SELECT.innerHTML += `<option value="${m.id}">${m.name}</option>`;
        });
      }
    });

    if (adminToken) showAdmin();

    const passwordInput = document.getElementById('adminPassword');
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    function populateDefaultProviderOptions() {
      const sel = DEFAULT_PROVIDER_SELECT;
      sel.innerHTML = '';
      Object.entries(DEFAULT_PROVIDERS).forEach(([id, prov]) => {
        sel.innerHTML += `<option value="${id}">${prov.name}</option>`;
      });
      sel.value = 'cloudflare';
      sel.dispatchEvent(new Event('change'));
    }

    async function handleLogin() {
      const password = document.getElementById('adminPassword').value;
      if (!password) return;
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (data.code === 200) {
          adminToken = data.data.token;
          sessionStorage.setItem('adminToken', adminToken);
          showAdmin();
        } else {
          showToast(data.message, 'error');
        }
      } catch (err) {
        showToast('登录失败: ' + err.message, 'error');
      }
    }

    function handleLogout() {
      adminToken = '';
      sessionStorage.removeItem('adminToken');
      document.getElementById('loginPage').style.display = '';
      document.getElementById('adminPage').style.display = 'none';
    }

    async function showAdmin() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('adminPage').style.display = '';
      populateDefaultProviderOptions();
      await Promise.all([loadConfig(), loadApiKeys()]);
    }

    async function loadConfig() {
      try {
        const res = await fetch('/api/admin/config', {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        const data = await res.json();
        if (data.code === 200) {
          renderProviders(data.data.providers || DEFAULT_PROVIDERS);
          const savedProvider = data.data.defaultProvider || 'cloudflare';
          DEFAULT_PROVIDER_SELECT.value = savedProvider;
          DEFAULT_PROVIDER_SELECT.dispatchEvent(new Event('change'));
          const savedModel = data.data.defaultModel || '@cf/meta/m2m100-1.2b';
          DEFAULT_MODEL_SELECT.value = savedModel;
          document.getElementById('translatePrompt').value = data.data.promptTemplates?.translate || '';
          document.getElementById('detectPrompt').value = data.data.promptTemplates?.detect || '';
        }
      } catch {}
    }

    function renderProviders(providers) {
      const list = document.getElementById('providersList');
      list.innerHTML = '';
      Object.entries(providers).forEach(([id, prov]) => {
        const modelTags = prov.models.map(m => `<span class="model-tag">${m.name}</span>`).join('');
        list.innerHTML += `<div class="provider-item">
          <div class="provider-info">
            <strong class="provider-name">${prov.name}</strong>
            <div class="provider-models">${modelTags}</div>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" data-provider="${id}" ${prov.enabled ? 'checked' : ''}>
            <span class="toggle-slider"></span>
          </label>
        </div>`;
      });
    }

    const apiKeyProviderSelect = document.getElementById('apiKeyProviderSelect');
    const customEndpointRow = document.getElementById('customEndpointRow');
    apiKeyProviderSelect.addEventListener('change', () => {
      customEndpointRow.style.display = apiKeyProviderSelect.value === 'custom' ? 'flex' : 'none';
    });

    async function loadApiKeys() {
      try {
        const res = await fetch('/api/admin/apiKeys', {
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        const data = await res.json();
        if (data.code === 200) {
          renderSavedKeys(data.data);
        }
      } catch {}
    }

    function renderSavedKeys(keys) {
      const list = document.getElementById('savedKeysList');
      if (!keys || Object.keys(keys).length === 0) {
        list.innerHTML = '<div class="empty-keys">暂无已保存的 API Key</div>';
        return;
      }
      list.innerHTML = '';
      Object.entries(keys).forEach(([provider, keyData]) => {
        const provName = DEFAULT_PROVIDERS[provider]?.name || provider;
        const status = keyData.configured ? 'active' : 'inactive';
        const statusText = keyData.configured ? '已配置' : '未配置';
        list.innerHTML += `<div class="saved-key-item ${status}">
          <div class="saved-key-info">
            <span class="saved-key-name">${provName}</span>
            <span class="saved-key-masked">${keyData.apiKey || '未设置'}</span>
            <span class="saved-key-status ${status}">${statusText}</span>
          </div>
          <button class="saved-key-delete" onclick="handleDeleteApiKey('${provider}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>`;
      });
    }

    async function handleSaveApiKey() {
      const provider = apiKeyProviderSelect.value;
      const apiKey = document.getElementById('apiKeyInput').value;
      const customEndpoint = provider === 'custom' ? document.getElementById('customEndpoint').value : '';
      if (!provider || !apiKey) return showToast('请选择提供商并输入 API Key', 'error');

      try {
        const res = await fetch('/api/admin/apiKeys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
          body: JSON.stringify({ provider, apiKey, customEndpoint })
        });
        const data = await res.json();
        if (data.code === 200) {
          showToast(data.message, 'success');
          await fetchModelsForProvider(provider, apiKey, customEndpoint);
          document.getElementById('apiKeyInput').value = '';
          await loadApiKeys();
        } else {
          showToast(data.message, 'error');
        }
      } catch (err) {
        showToast('保存失败: ' + err.message, 'error');
      }
    }

    async function fetchModelsForProvider(provider, apiKey, customEndpoint) {
      showToast('正在获取模型列表...', 'info');
      try {
        const res = await fetch('/api/admin/getModels', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
          body: JSON.stringify({ provider, apiKey, customEndpoint })
        });
        const data = await res.json();
        if (data.code === 200 && data.data.models.length > 0) {
          await saveProviderModels(provider, data.data.models);
          showToast(`成功获取 ${data.data.models.length} 个模型并已保存`, 'success');
        } else if (data.data.message) {
          showToast(data.data.message, 'warning');
        } else {
          showToast('未获取到模型列表', 'warning');
        }
      } catch (err) {
        showToast('获取模型失败: ' + err.message, 'error');
      }
    }

    async function saveProviderModels(provider, models) {
      const formattedModels = models.slice(0, 50).map(m => ({
        id: m.id,
        name: m.name || m.id
      }));
      currentProviders[provider] = { ...currentProviders[provider], models: formattedModels, enabled: true };
      renderProviders(currentProviders);
      DEFAULT_PROVIDER_SELECT.dispatchEvent(new Event('change'));
      await saveAllProviders();
    }

    async function saveAllProviders() {
      const providers = {};
      Object.entries(currentProviders).forEach(([id, prov]) => {
        providers[id] = {
          name: prov.name,
          enabled: prov.enabled,
          models: prov.models || []
        };
      });
      const body = {
        providers,
        defaultProvider: document.getElementById('defaultProvider').value,
        defaultModel: document.getElementById('defaultModel').value,
        promptTemplates: {
          translate: document.getElementById('translatePrompt').value,
          detect: document.getElementById('detectPrompt').value
        }
      };
      try {
        await fetch('/api/admin/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
          body: JSON.stringify(body)
        });
      } catch (err) {
        console.error('自动保存配置失败:', err);
      }
    }

    async function handleTestKey() {
      const provider = apiKeyProviderSelect.value;
      const apiKey = document.getElementById('apiKeyInput').value;
      const customEndpoint = provider === 'custom' ? document.getElementById('customEndpoint').value : '';
      if (!apiKey) return showToast('请先输入 API Key', 'error');

      showToast('正在测试连接...', 'info');
      await fetchModelsForProvider(provider, apiKey, customEndpoint);
    }

    async function handleDeleteApiKey(provider) {
      if (!confirm('确定要删除此 API Key 吗?')) return;
      try {
        const res = await fetch(`/api/admin/apiKeys?provider=${provider}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${adminToken}` }
        });
        const data = await res.json();
        if (data.code === 200) {
          showToast('已删除', 'success');
          await loadApiKeys();
        } else {
          showToast(data.message, 'error');
        }
      } catch (err) {
        showToast('删除失败: ' + err.message, 'error');
      }
    }

    async function handleSaveConfig() {
      const providers = {};
      document.querySelectorAll('#providersList input[type=checkbox]').forEach(cb => {
        const id = cb.dataset.provider;
        providers[id] = { ...currentProviders[id], enabled: cb.checked };
      });
      const body = {
        providers,
        defaultProvider: document.getElementById('defaultProvider').value,
        defaultModel: document.getElementById('defaultModel').value,
        promptTemplates: {
          translate: document.getElementById('translatePrompt').value,
          detect: document.getElementById('detectPrompt').value
        }
      };
      try {
        const res = await fetch('/api/admin/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        showToast(data.code === 200 ? '保存成功' : data.message, data.code === 200 ? 'success' : 'error');
      } catch (err) {
        showToast('保存失败: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
